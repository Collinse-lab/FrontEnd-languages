<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet"href="styles.css">
</head>

<body>
    <h1>Stylized To-Do list</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox"id="wake-up">
            <label for="wake-up">Wake up early</label>
            <ul class="sub-item">
                <li><a class="sub-item-link"href="https://www.wakingup.com"target="_blank">Waking up</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox"id="exercise">
            <label for="exercise">Exercise for 30 minutes</label>
            <ul class="sub-item">
                <li><a class="sub-item-link"href="https://www.exercise.com"target="_blank">Exercising</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox"id="cooking">
            <label for="cooking">Prepare meals or snacks for the day</label>
            <ul class="sub-item">
                <li><a class="sub-item-link"href="https://www.cooking.com"target="_blank">Cooking</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox"id="mails">
            <label for="mails">Check emails</label>
            <ul class="sub-item">
                <li><a class="sub-item-link"href="https://www.mail.com"target="_blank">Mail</a></li>
            </ul>
        </li>
    </ul>

</body>

</html>
