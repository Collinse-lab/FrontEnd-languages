<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet"href="styles.css">
</head>
<body>
<div class="blog-post-card">
    <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="image of a person typing on a laptop">
    <div class="post-content">
        <h2 class="post-title">What is a blog post</h2>
        <p class="post-excerpt">A blog post is a piece of written content published on a website, typically covering a specific topic to inform, educate, or engage readers.</p>
        <a class="read-more">Read More</a>
</div>
</div>
</body>
</html>
