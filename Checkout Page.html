<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
<h1>Checkout</h1>
<section>
    <h2>Your Cart </h2>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"alt="Multi-coloured dice">
</section>
<section>
    <h2>Payment Information </h2>
    <form>
         <label for="card-name">Card Name(Required):<span aria-hidden="true">*</span></label>
        <input id="card-name"type="text"name="card-name"required><br/>
        <label for="card-number">Card Number(Required:<span aria-hidden="true">*</span></label>
        <input id="card-number"type="text"name="card-number"aria-describedby="card-number-help"required>
        <p id="card-number-help">Requires 16 digits</p>
    </form>
</section>
</body>

</html>
