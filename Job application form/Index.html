<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"href="./styles.css" />
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>
<div class="container">
<form>
    <label for="name">Name: </label>
    <input type="text"id="name"/>
    <br/>
    <label for="email">Email: </label>
    <input type="email"id="email"/>
    <br/>
    <label>Position: </label>
    <select id="position">
        <option>CEO</option>
        <option>Manager</option>
        <option>Director</option>
        <option>Secretary</option>
    </select>
    <fieldset class="radio-group">
        <legend>Availability</legend>
        <input
        id="radio" type="radio" name="availability"/>
        <label for="radio">Full-Time</label>
     <input 
     id="radio"type="radio" name="availability"/>   <label for="radio">Part-Time</label>
    </fieldset>
    <textarea id="message"name="message" rows="4" cols="50">Any additional information?</textarea>
    <br/>
    <button class="submit-btn" type="submit">Submit</button>
</form>
</div>
</body>
</html>
